<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
<link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<style>
:root {
  --paper: #f7f4ee;
  --paper-2: #efe9df;
  --ink: #1f1d1a;
  --ink-2: #57524a;
  --ink-3: #8a8378;
  --rule: #ddd5c8;
  --accent: #1d5c63;
  --accent-soft: #dcebea;
  --stated: #2f6b3a;
  --stated-soft: #e0eedf;
  --inferred: #8a5a00;
  --inferred-soft: #f5e8cc;
  --warn: #9b2c2c;
  --warn-soft: #f6dfdc;
  --code-bg: #fffdf9;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171614;
    --paper-2: #211f1c;
    --ink: #ece6dc;
    --ink-2: #b5ada1;
    --ink-3: #847d72;
    --rule: #34302b;
    --accent: #7cc4c9;
    --accent-soft: #1d3134;
    --stated: #8fd19a;
    --stated-soft: #1c2e1f;
    --inferred: #e7b85c;
    --inferred-soft: #33291a;
    --warn: #f09a8f;
    --warn-soft: #3a1f1c;
    --code-bg: #1d1b19;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 24px; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 19px/1.65 var(--serif);
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}
.page {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  max-width: 1180px;
  margin: 0 auto;
  padding: 56px 16px 96px;
}
@media (min-width: 1120px) {
  .page { grid-template-columns: 220px minmax(0, 720px); gap: 72px; justify-content: center; }
}
article { min-width: 0; max-width: 720px; margin: 0 auto; width: 100%; }

/* --- table of contents --- */
nav.toc { display: none; font-family: var(--sans); font-size: 13.5px; line-height: 1.45; }
@media (min-width: 1120px) {
  nav.toc { display: block; position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 112px); overflow: auto; }
}
nav.toc p { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
nav.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
nav.toc a { display: block; padding: 5px 0 5px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--ink-2); text-decoration: none; }
nav.toc a:hover { color: var(--ink); }
nav.toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* --- header --- */
.hero { margin-bottom: 40px; padding-bottom: 28px; border-bottom: 1px solid var(--rule); }
.kicker { margin: 0 0 14px; font: 500 13px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 16px; font-size: clamp(30px, 5vw, 42px); line-height: 1.15; font-weight: 700; letter-spacing: -.012em; text-wrap: balance; }
h1 code, h2 code, h3 code { font-size: .62em; font-weight: 500; padding: .08em .3em; vertical-align: .08em; }
.dek { margin: 0 0 24px; font-size: 21px; line-height: 1.5; color: var(--ink-2); font-style: italic; }
/* Works with bare dt/dd pairs or pairs wrapped in divs. */
dl.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; align-items: baseline; margin: 0; font-family: var(--sans); font-size: 14.5px; line-height: 1.5; }
dl.meta > div { display: contents; }
dl.meta dt { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
dl.meta dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
dl.meta code { font-size: .88em; }

/* --- prose --- */
h2 { margin: 64px 0 18px; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -.008em; }
h3 { margin: 40px 0 12px; font-size: 21px; line-height: 1.35; font-weight: 600; }
h4 { margin: 0 0 8px; font: 600 12px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
p, ul, ol { margin: 0 0 20px; }
ul, ol { padding-left: 1.3em; }
li { margin-bottom: 8px; }
li > ul, li > ol { margin: 8px 0 0; }
strong { font-weight: 600; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 48px 0; }
code { font-family: var(--mono); font-size: .82em; background: var(--paper-2); padding: .12em .36em; border-radius: 4px; overflow-wrap: anywhere; }
a.ref { text-decoration: none; }
a.ref code { color: var(--accent); background: var(--accent-soft); }
a.ref:hover code { text-decoration: underline; }
table { width: 100%; border-collapse: collapse; margin: 0 0 24px; font: 15px/1.5 var(--sans); display: block; overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* --- TL;DR --- */
.tldr { margin: 0 0 8px; padding: 22px 26px 4px; background: var(--paper-2); border-radius: 10px; }
.tldr h2 { margin: 0 0 10px; font: 600 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tldr p, .tldr li { font-size: 20px; line-height: 1.55; }

/* --- evidence tags --- */
.tag { display: inline-block; margin: 0 2px; padding: 1px 8px; border-radius: 999px; font: 600 11.5px/1.7 var(--sans); letter-spacing: .03em; vertical-align: 2px; white-space: nowrap; }
.tag.stated { color: var(--stated); background: var(--stated-soft); }
.tag.inferred { color: var(--inferred); background: var(--inferred-soft); }
blockquote.source { margin: 0 0 22px; padding: 4px 0 4px 20px; border-left: 3px solid var(--stated); color: var(--ink-2); }
blockquote.source p { margin-bottom: 8px; }
blockquote.source cite { display: block; font: 500 13px/1.4 var(--sans); font-style: normal; color: var(--ink-3); }
blockquote.source cite::before { content: "— "; }

/* --- callouts --- */
aside.callout { margin: 0 0 24px; padding: 14px 18px; border-radius: 8px; background: var(--accent-soft); font-size: 17.5px; }
aside.callout.warn { background: var(--warn-soft); }
aside.callout > :last-child { margin-bottom: 0; }
aside.callout strong:first-child { font-family: var(--sans); font-size: 14px; }

/* --- code --- */
figure { margin: 0 0 26px; }
figure.code { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
figure.code figcaption { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 14px; border-bottom: 1px solid var(--rule); font: 500 13px/1.4 var(--sans); color: var(--ink-3); background: var(--paper-2); }
figure.code figcaption code { background: none; padding: 0; color: var(--ink-2); }
figure.code pre { margin: 0; }
pre { margin: 0 0 24px; padding: 14px 16px; overflow-x: auto; background: var(--code-bg); border-radius: 8px; font: 13.5px/1.6 var(--mono); tab-size: 2; }
figure.code pre, pre code, pre code.hljs { background: transparent; padding: 0; border-radius: 0; font-size: 13.5px; }
figure.code pre { padding: 14px 16px; }
.hljs { color: var(--ink); }

/* --- before / after --- */
.compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 0 0 26px; }
@media (min-width: 720px) { .compare { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.compare > div { min-width: 0; padding: 16px 18px; border-radius: 8px; border: 1px solid var(--rule); font-size: 17px; }
.compare > .before h4 { color: var(--ink-3); }
.compare > .after { border-color: var(--accent); }
.compare > .after h4 { color: var(--accent); }
.compare > div > :last-child { margin-bottom: 0; }
.compare figure.code, .compare pre { margin-bottom: 0; }

/* --- diagrams --- */
figure.diagram { padding: 20px 16px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--code-bg); overflow-x: auto; }
figure.diagram pre.mermaid { margin: 0; padding: 0; background: none; text-align: center; font-family: var(--sans); white-space: pre; }
figure.diagram pre.mermaid svg { max-width: none; height: auto; }
figure.diagram figcaption { margin-top: 12px; font: 14px/1.5 var(--sans); color: var(--ink-3); text-align: center; }
pre.mermaid:not([data-processed]) { color: var(--ink-3); text-align: left; }

/* --- lists with a job --- */
ul.checklist, ol.questions, ul.sources { padding-left: 0; list-style: none; }
ul.checklist li, ol.questions li { position: relative; padding-left: 30px; }
ul.checklist li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 13px; height: 13px; border: 1.5px solid var(--ink-3); border-radius: 3px; }
ol.questions { counter-reset: q; }
ol.questions li { counter-increment: q; }
ol.questions li::before { content: counter(q); position: absolute; left: 0; top: .2em; width: 21px; height: 21px; border-radius: 50%; background: var(--inferred-soft); color: var(--inferred); font: 600 12px/21px var(--sans); text-align: center; }
ul.sources { font: 15px/1.55 var(--sans); color: var(--ink-2); }
ul.sources li { padding-left: 0; }
dl.terms { margin: 0 0 24px; }
dl.terms dt { font-weight: 600; }
dl.terms dd { margin: 2px 0 14px; color: var(--ink-2); }

footer.colophon { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--rule); font: 13px/1.6 var(--sans); color: var(--ink-3); }

@media (max-width: 640px) {
  body { font-size: 17.5px; }
  .page { padding-top: 32px; }
  h2 { font-size: 24px; margin-top: 52px; }
  .dek { font-size: 19px; }
  .tldr { padding: 18px 18px 2px; }
  .tldr p, .tldr li { font-size: 18px; }
}
@media print {
  nav.toc { display: none; }
  .page { display: block; padding: 0; }
  body { background: #fff; }
}
</style>
</head>
<body>
<div class="page">
<nav class="toc" aria-label="Contents"><p>Contents</p><ol></ol></nav>
<article>
{{ARTICLE}}
<footer class="colophon">Written by /explain-pr on {{GENERATED}}. Tags show where each claim comes from: <span class="tag stated">Stated</span> means someone wrote it down (PR, issue, commit, review), <span class="tag inferred">Inferred</span> means Claude worked it out from the code and could be wrong.</footer>
</article>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>
  // Contents: one entry per h2, highlighted while you read.
  (function () {
    var list = document.querySelector("nav.toc ol");
    var heads = Array.prototype.slice.call(document.querySelectorAll("article h2"));
    heads.forEach(function (h, i) {
      if (!h.id) h.id = (h.textContent || "section").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "s" + i;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "#" + h.id; a.textContent = h.textContent; li.appendChild(a); list.appendChild(li);
    });
    if (!heads.length) return;
    var links = list.querySelectorAll("a"), queued = false;
    // The current section is the last heading above the top third of the screen.
    function mark() {
      queued = false;
      var current = heads[0];
      heads.forEach(function (h) { if (h.getBoundingClientRect().top < window.innerHeight / 3) current = h; });
      links.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + current.id); });
    }
    window.addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(mark); } }, { passive: true });
    mark();
  })();
  if (window.hljs) {
    document.querySelectorAll("pre code").forEach(function (el) {
      if (!el.parentElement.classList.contains("mermaid")) hljs.highlightElement(el);
    });
  }
</script>
<script type="module">
  if (document.querySelector("pre.mermaid")) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    // Natural size: wide diagrams scroll sideways instead of shrinking to unreadable text.
    mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "neutral",
      fontFamily: "IBM Plex Sans, sans-serif", themeVariables: { fontSize: "15px" },
      flowchart: { useMaxWidth: false }, sequence: { useMaxWidth: false },
    });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
</body>
</html>
